<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAN Card Design</title>
    <link rel="stylesheet" href="pancard.css">
</head>

<body>

    <div class="pan-card">

        <!-- Top Section -->
        <div class="top">

            <div class="income">
                <p>आयकर विभाग</p>
                <h3>INCOME TAX DEPARTMENT</h3>
            </div>

            <div class="emblem">
                <span>♛</span>
            </div>

            <div class="govt">
                <p>भारत सरकार</p>
                <h3>GOVT. OF INDIA</h3>

                <div class="qr">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d0/QR_code_for_mobile_English_Wikipedia.svg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original" alt="">
                </div>
            </div>

        </div>


        <!-- Card Title -->
        <div class="card-title">
            <p>स्थायी लेखा संख्या कार्ड</p>
            <h3>Permanent Account Number Card</h3>
        </div>


        <!-- Main Content -->
        <div class="content">

            <!-- Photo -->
            <div class="photo">
                <img src="photo.jpg" alt="Photo">
            </div>


            <!-- Details -->
            <div class="details">

                <p class="label" style="text-align: center;">Permanent Account Number</p>
                <h2 class="pan-number" style="text-align: center; font-size: 25px;">ABCDE1234F</h2>

                <p class="label">Name</p>
                <h3>VIBHAVARI SONAWANE</h3>

                <p class="label">Father's Name</p>
                <h3>SANJAY SONAWANE</h3>

                <p class="label">Date of Birth</p>
                <h3>23/04/2004</h3>

            </div>
            <!-- Right Side -->

            <div class="right-side">
                <div class="signature">
                    Signature
                </div>
            </div>

        </div>

    </div>

</body>
</html>
