<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="adharcard.css">
</head>
<body>
    <div class="card">
        <div class="top-section">
            <div class="building">🏛</div>

            <div class="title">
                <div class="title-red">भारत सरकार</div>
                <div class="title-green">Government of India</div>
            </div>
            <div class="sample-logo">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_aFdqrr78Y5enbDNrazWNztUNWrBbrGIm8lUitHEKog&s" alt="">
            </div>
        </div>
        <div class="middle-section">
            <div class="photo">
                <img src="photo.jpg" alt="Profile Photo">
            </div>
            <div class="details">
                <p class="name-marathi">विभावरी संजय सोनवणे</p>
                <p>Vibhavari Sanjay Sonawane</p>
                <p><b>DATE OF BIRTH:</b>23/04/2004</p>
                <P><B>GENDER:</B>Female</P>
            </div>
            <div class="qr">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d0/QR_code_for_mobile_English_Wikipedia.svg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original" alt="">
                </div>
        </div>
        <div class="number">
            1234&nbsp;&nbsp;5678&nbsp;&nbsp;8888&nbsp;&nbsp;9999
        </div>
        <div class="line"></div>

        <div class="bottom-text">
            माझे आधार,माझी ओळख
        </div>
    </div>
</body>
</html>
